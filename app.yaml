# app.yaml — Databricks Apps configuration
#
# The DATABASE resource auto-injects PGHOST / PGPORT / PGDATABASE / PGUSER
# (no yaml needed). But a SECRET resource is NOT auto-injected — you must bind
# it to an env var here with valueFrom, referencing the secret's Resource key.
#
# Secret resource (set in the app UI):
#   scope=weather-app, secret=pgpassword, Resource key=PGPASSWORD, Can read
#
# The line below turns that secret into the PGPASSWORD env var the app reads,
# completing the PG* set so lakebase_weather.py can connect.

command: ["python", "app.py"]

env:
  - name: "PGPASSWORD"
    valueFrom: "PGPASSWORD"   # <- the Secret resource's Resource key