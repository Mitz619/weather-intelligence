# app.yaml — Databricks Apps configuration
#
# Database credentials are NOT set here. Attach your Lakebase instance as an
# app resource in the Databricks App UI; Databricks then injects
# PGHOST / PGPORT / PGDATABASE / PGUSER / PGPASSWORD at runtime, and
# get_connection() builds the connection from those. Nothing sensitive in yaml.
#
# Alternative (if you prefer a single URL from a secret scope), add instead:
#   env:
#     - name: "DATABASE_URL"
#       valueFrom: "database-url"   # secret KEY name, never the value itself

command: ["python", "app.py"]